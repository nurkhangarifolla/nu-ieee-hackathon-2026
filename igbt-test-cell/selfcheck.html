<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IGBT Test Cell — Self-check (SIMULATION)</title>
<style>
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:#1b1f24; background:#f6f7f9; }
  #sim-banner { position:sticky; top:0; background:#ffd666; color:#7a4b00; font-weight:700; text-align:center; padding:8px; border-bottom:2px solid #7a4b00; }
  main { max-width:1000px; margin:0 auto; padding:20px; }
  table { border-collapse:collapse; width:100%; background:#fff; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid #d5dae0; vertical-align:top; }
  .PASS { color:#0b6b2e; font-weight:700; }
  .FAIL { color:#a1121b; font-weight:700; }
  #total { font-size:18px; font-weight:700; margin:12px 0; }
  code { font-size:12px; }
</style>
</head>
<body>
<div id="sim-banner"></div>
<main>
  <h1>Self-check: validation, configuration preflight and S0 engine</h1>
  <p>Runs in this browser with the same scripts as <code>index.html</code>.</p>
  <div id="total"></div>
  <table><thead><tr><th>#</th><th>Case</th><th>Result</th><th>Detail</th></tr></thead><tbody id="rows"></tbody></table>
</main>

<script src="js/data.js"></script>
<script src="js/validate.js"></script>
<script src="js/rng.js"></script>
<script src="js/models.js"></script>
<script src="js/engine.js"></script>
<script src="js/sequencer.js"></script>
<script src="js/report.js"></script>
<script src="js/ui.js"></script>
<script id="checks">
window.IGBT.selfcheck = (function () {
  var V = window.IGBT.validate, D = window.APP_DATA;
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function setup(extra) {
    var s = { module_id: "DEMO-MODULE-01", profile_id: "demo", scenario_id: "S0", seed: 20261018, speed: 8, operator: "selfcheck" };
    for (var k in (extra || {})) s[k] = extra[k];
    return s;
  }
  function demo() { return clone(V.findProfile("demo")); }
  function rule(p, q) { return p.rules.filter(function (r) { return r.quantity_id === q; })[0]; }
  function fmt(errs) { return errs.map(function (e) { return e.field + " = " + JSON.stringify(e.value) + ": " + e.rule; }).join(" | "); }
  // expect validation errors, at least one on `field`
  function rejects(errs, field) {
    var hit = errs.some(function (e) { return e.field === field; });
    return { pass: hit, detail: errs.length ? fmt(errs) : "no error raised" };
  }
  function invalid(res, field) {
    if (res.status !== "INVALID") return { pass: false, detail: "status " + res.status };
    return rejects(res.errors, field);
  }

  var cases = [];
  function add(name, fn) { cases.push({ name: name, fn: fn }); }

  // Defaults valid
  add("Module defaults valid", function () { var e = V.validateModule(clone(D.module_defaults)); return { pass: e.length === 0, detail: e.length ? fmt(e) : "0 errors" }; });
  D.profiles.forEach(function (p) {
    add("Profile " + p.profile_id + " valid (incl. bench conditions, " + p.rules.length + " rules)", function () {
      var e = V.validateProfile(clone(p)); return { pass: e.length === 0, detail: e.length ? fmt(e) : "0 errors" };
    });
  });
  add("Setup defaults valid", function () { var e = V.validateSetup(setup()); return { pass: e.length === 0, detail: e.length ? fmt(e) : "0 errors" }; });
  add("Preflight S0 with defaults → OK", function () {
    var r = V.configPreflight(setup()); return { pass: r.status === "OK", detail: "status " + r.status + (r.errors ? ": " + fmt(r.errors) : "") };
  });
  add("Derived: t_safe from defaults = 24.85 s (< discharge_timeout_s 120 s)", function () {
    var t = V.tSafe(demo().bench_conditions); return { pass: t.toFixed(2) === "24.85", detail: "t_safe = " + t.toFixed(4) + " s" };
  });

  // AC-14 set
  add("AC-14 r_ce_mohm = −1 rejected (Custom)", function () {
    return invalid(V.configPreflight(setup({ scenario_id: "CUSTOM", custom_overrides: { module: { r_ce_mohm: -1 }, bench: {} } })), "module.r_ce_mohm");
  });
  add("AC-14 dclink_c_mf = 0 rejected", function () {
    var b = demo().bench_conditions; b.dclink_c_mf = 0; return rejects(V.validateBench(b), "bench.dclink_c_mf");
  });
  add("AC-14 v_safe_v = v_dc_test_v rejected", function () {
    var b = demo().bench_conditions; b.v_safe_v = b.v_dc_test_v; return rejects(V.validateBench(b), "bench.v_safe_v");
  });
  add("AC-14 v_safe_v > v_dc_test_v rejected", function () {
    var b = demo().bench_conditions; b.v_safe_v = 700; return rejects(V.validateBench(b), "bench.v_safe_v");
  });
  add("AC-14 speed = 0 rejected", function () { return invalid(V.configPreflight(setup({ speed: 0 })), "setup.speed"); });
  add("AC-14 window min ≥ max rejected (Q01 0.8–0.8)", function () {
    var p = demo(); rule(p, "Q01").min = 0.8; return rejects(V.validateProfile(p), "profile.demo.rules.Q01.min");
  });
  add("AC-14 window min > max rejected (Q06 16–14)", function () {
    var p = demo(); rule(p, "Q06").min = 16; rule(p, "Q06").max = 14; return rejects(V.validateProfile(p), "profile.demo.rules.Q06.min");
  });
  add("AC-14 info rule with a limit rejected (Q16 max 200)", function () {
    var p = demo(); rule(p, "Q16").max = 200; return rejects(V.validateProfile(p), "profile.demo.rules.Q16.max");
  });
  add("AC-14 demo rule missing a limit rejected (Q09 max null)", function () {
    var p = demo(); rule(p, "Q09").max = null; return rejects(V.validateProfile(p), "profile.demo.rules.Q09.max");
  });
  add("AC-14 unknown override key rejected (module.foo)", function () {
    return rejects(V.validateOverrides({ module: { foo: 1 }, bench: {} }), "module.foo");
  });
  add("AC-14 unknown override key rejected via preflight (Custom)", function () {
    return invalid(V.configPreflight(setup({ scenario_id: "CUSTOM", custom_overrides: { module: { foo: 1 }, bench: {} } })), "module.foo");
  });

  // Approval and profile status
  add("approval_status APPROVED rejected (AC-09)", function () {
    var p = demo(); rule(p, "Q08").approval_status = "APPROVED"; return rejects(V.validateProfile(p), "profile.demo.rules.Q08.approval_status");
  });
  add("profile_status production_approved rejected", function () {
    var p = demo(); p.profile_status = "production_approved"; return rejects(V.validateProfile(p), "profile.demo.profile_status");
  });

  // S5 configuration block
  add("S5 → CONFIG_BLOCKED, block_reason CONFIGURATION_PREFLIGHT", function () {
    var r = V.configPreflight(setup({ scenario_id: "S5" }));
    return { pass: r.status === "CONFIG_BLOCKED" && r.block_reason === "CONFIGURATION_PREFLIGHT", detail: "status " + r.status + ", block_reason " + r.block_reason };
  });

  // Every P0 scenario's overrides valid, and preflight result as expected
  D.scenarios.filter(function (s) { return s.priority === "P0"; }).forEach(function (s) {
    add("P0 " + s.scenario_id + " overrides valid; preflight " + (s.force_profile ? "CONFIG_BLOCKED" : "OK"), function () {
      var e = V.validateOverrides(s.overrides);
      var r = V.configPreflight(setup({ scenario_id: s.scenario_id }));
      var want = s.force_profile ? "CONFIG_BLOCKED" : "OK";
      return { pass: e.length === 0 && r.status === want, detail: (e.length ? fmt(e) + "; " : "0 override errors; ") + "status " + r.status };
    });
  });

  // ---- S0 engine checks (TICKET 02; expected values from 03 §12 S0 row, σ = 0) ----
  var SEQ = window.IGBT.sequencer, REP = window.IGBT.report, RNG = window.IGBT.rng;
  function runScenario(id, stepper) {
    var pre = V.configPreflight(setup({ scenario_id: id }));
    var r = SEQ.create(pre);
    if (stepper) stepper(r); else SEQ.runToEnd(r);
    return { run: r, report: REP.buildJson(r, { run_id: "RUN-SELFCHECK", operator: "selfcheck" }) };
  }
  var s0cache = null;
  function s0() { if (!s0cache) s0cache = runScenario("S0"); return s0cache; }
  function det() { return s0().report.deterministic; }
  function reading(q) {
    var hit = null;
    det().stages.forEach(function (s) { s.readings.forEach(function (r) { if (r.quantity_id === q) hit = r; }); });
    return hit;
  }
  function eq(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
  function ev(d, type) { return d.events.filter(function (e) { return e.type === type; }); }

  var S0_VALUES = [["Q01", 0.35], ["Q02", true], ["Q03", 6.0], ["Q03b", 6.0], ["Q04", 11.0], ["Q05", true], ["Q06", 15.0], ["Q07", -15.0],
                   ["Q08", 0.05], ["Q09", 2.40], ["Q11", 0.05], ["Q16", 100], ["Q12", 1800], ["Q13", 780], ["Q14", 6.5], ["Q18", -15.0]];
  S0_VALUES.forEach(function (p) {
    add("S0 " + p[0] + " = " + p[1] + " (" + (p[0] === "Q16" ? "INFO" : "PASS") + ")", function () {
      var r = reading(p[0]);
      var want = p[0] === "Q16" ? "INFO" : "PASS";
      return { pass: !!r && r.value === p[1] && r.verdict === want, detail: r ? "value " + JSON.stringify(r.value) + ", " + r.verdict + ", margin " + r.margin : "missing" };
    });
  });
  add("S0 stage statuses: all DONE PASS; T06 NOT_APPLICABLE; T08b NOT_MODELLED", function () {
    var bad = [], got = det().stages.map(function (s) { return s.test_id + " " + s.status; });
    det().stages.forEach(function (s) {
      var want = s.test_id === "T06" ? "NOT_APPLICABLE" : s.test_id === "T08b" ? "NOT_MODELLED" : "DONE";
      var fails = s.readings.filter(function (r) { return r.required && r.verdict !== "PASS"; });
      if (s.status !== want || (want === "DONE" && fails.length)) bad.push(s.test_id);
    });
    return { pass: bad.length === 0 && det().stages.length === 12, detail: bad.length ? "wrong: " + bad.join(", ") : got.join(" · ") };
  });
  add("S0 judged readings carry basis + NOT_APPROVED; Q08 basis CASE_TRANSFERRED (AC-09)", function () {
    var bad = [];
    det().stages.forEach(function (s) { s.readings.forEach(function (r) {
      var judged = r.verdict === "PASS" || r.verdict === "FAIL";
      if (judged && (!r.rule_basis || r.approval_status !== "NOT_APPROVED" || r.reason.indexOf("NOT APPROVED") < 0)) bad.push(r.quantity_id);
    }); });
    var q8 = reading("Q08");
    return { pass: !bad.length && q8.rule_basis === "CASE_TRANSFERRED" && q8.reference_id === "REF-07", detail: bad.length ? "missing on " + bad.join(", ") : "Q08: " + q8.reason };
  });
  add("S0 Q09 equation built from values", function () {
    var r = reading("Q09"), want = "V_CE(sat) = 1.00 V + 0.007 Ω × 200 A = 2.40 V";
    return { pass: r.model_equation === want, detail: r.model_equation };
  });
  add("S0 safe-state block: v0 600 V, discharge 24.85 s, verified 40.94 V, SAFE", function () {
    var ss = det().safe_state;
    var ok = ss && ss.trigger === "NORMAL_COMPLETION" && ss.v_bus_at_start_v === 600 && ss.discharge_required === true && ss.discharge_time_s === 24.85 &&
      ss.v_bus_at_verification_v === 40.94 && ss.verification === "VERIFIED" && ss.door === "UNLOCKED" && ss.final_state === "SAFE" &&
      ss.gate_measured_v === -15 && ss.gate_off_confirmed === true;
    return { pass: !!ok, detail: JSON.stringify(ss) };
  });
  add("S0 overall PASS with the 05 §8 label; not an acceptance decision", function () {
    var o = det().overall;
    return { pass: o.verdict === "PASS" && o.verdict_label === D.verdict_labels.PASS && o.is_acceptance_decision === false && o.abort_reason === null && o.block_reason === null,
             detail: o.verdict + " · " + o.verdict_label + " · " + o.precedence_reason };
  });
  add("S0 physical_total_s = 499.85", function () { return { pass: det().physical_total_s === 499.85, detail: String(det().physical_total_s) }; });
  add("S0 animation total = 62.48 s at speed 8", function () {
    var p = s0().report.presentation;
    return { pass: p.animation_total_s === 62.48 && det().inputs.speed === 8, detail: p.animation_total_s + " s at speed " + det().inputs.speed };
  });
  add("S0 exactly one DISCHARGE_START; door unlocks only after DISCHARGE_VERIFIED", function () {
    var d = det(), ds = ev(d, "DISCHARGE_START"), v = ev(d, "DISCHARGE_VERIFIED"), u = ev(d, "DOOR_UNLOCKED");
    return { pass: ds.length === 1 && v.length === 1 && u.length === 1 && u[0].seq > v[0].seq,
             detail: ds.length + " DISCHARGE_START; VERIFIED seq " + (v[0] && v[0].seq) + " at " + (v[0] && v[0].physical_time_s) + " s; DOOR_UNLOCKED seq " + (u[0] && u[0].seq) };
  });
  add("S0 no bus voltage before T07 (BUS_CHARGE_START at T07 start, 290 s)", function () {
    var b = ev(det(), "BUS_CHARGE_START");
    return { pass: b.length === 1 && b[0].stage === "T07" && b[0].physical_time_s === 290, detail: b.length ? b[0].stage + " at " + b[0].physical_time_s + " s" : "none" };
  });
  add("AC-02 two S0 runs give byte-identical deterministic sections", function () {
    var a = JSON.stringify(runScenario("S0").report.deterministic), b = JSON.stringify(runScenario("S0").report.deterministic);
    return { pass: a === b, detail: a === b ? "identical (" + a.length + " characters)" : "differ" };
  });
  add("S0 same result with UI-size steps (advance 0.8 s) as with runToEnd", function () {
    var stepped = runScenario("S0", function (r) { SEQ.start(r); for (var i = 0; i < 5000 && !SEQ.isTerminal(r); i++) SEQ.advance(r, 0.8); });
    return { pass: eq(stepped.report.deterministic, det()), detail: eq(stepped.report.deterministic, det()) ? "identical" : "differ" };
  });
  add("σ = 0: the PRNG is never consulted", function () { s0(); return { pass: RNG.prngCalls() === 0, detail: RNG.prngCalls() + " PRNG calls" }; });
  add("Report JSON: simulation true, banner text, deterministic events without animation_time_s", function () {
    var rep = s0().report;
    var noAnim = rep.deterministic.events.every(function (e) { return !e.hasOwnProperty("animation_time_s"); });
    var parsed = JSON.parse(REP.serialise(rep));
    return { pass: parsed.simulation === true && parsed.simulation_banner === D.fixed_texts.banner && noAnim && parsed.limitations === D.fixed_texts.limitations,
             detail: "simulation " + parsed.simulation + "; banner " + (parsed.simulation_banner === D.fixed_texts.banner ? "OK" : "wrong") + "; " + rep.case_references.length + " case references" };
  });
  add("AC-12 S0 abort during T08a: one DISCHARGE_START, extra aborts only add WARNING", function () {
    var r = runScenario("S0", function (x) {
      SEQ.start(x); SEQ.advance(x, 365);
      SEQ.abort(x, "OPERATOR"); SEQ.abort(x, "OPERATOR"); SEQ.abort(x, "OPERATOR");
      SEQ.setInterlock(x, "IL1", false);
      SEQ.advance(x, 5); SEQ.abort(x, "OPERATOR");
      SEQ.advance(x, Infinity);
    });
    var d = r.report.deterministic, st = {};
    d.stages.forEach(function (s) { st[s.test_id] = s.status; });
    var warn = ev(d, "WARNING").length, ds = ev(d, "DISCHARGE_START").length, ab = ev(d, "ABORT_TRIGGER").length;
    var v = ev(d, "DISCHARGE_VERIFIED")[0], u = ev(d, "DOOR_UNLOCKED")[0];
    var ok = ds === 1 && ab === 1 && warn === 4 && st.T08a === "INTERRUPTED" && st.T09 === "NOT_RUN" && st.T08b === "NOT_MODELLED" &&
      d.overall.verdict === "ABORTED" && d.overall.abort_reason === "OPERATOR" && u && v && u.seq > v.seq && d.safe_state.final_state === "SAFE";
    return { pass: !!ok, detail: ds + " DISCHARGE_START, " + ab + " ABORT_TRIGGER, " + warn + " WARNING; T08a " + st.T08a + "; overall " + d.overall.verdict + " (" + d.overall.abort_reason + "); physical " + d.physical_total_s + " s" };
  });
  add("CONFIG_BLOCKED JSON (S5): every stage NOT_RUN, safe_state null, 0 s, NOT EVALUATED", function () {
    var j = REP.buildConfigBlockedJson(V.configPreflight(setup({ scenario_id: "S5" })), { run_id: "RUN-SELFCHECK", operator: "selfcheck" });
    var d = j.deterministic;
    var ok = d.stages.every(function (s) { return s.status === "NOT_RUN" && s.blocked_reason === D.fixed_texts.config_blocked_stage_reason; }) &&
      d.safe_state === null && d.physical_total_s === 0 && d.overall.verdict === "NOT EVALUATED" && d.overall.block_reason === "CONFIGURATION_PREFLIGHT" &&
      ev(d, "BUS_CHARGE_START").length === 0 && j.simulation === true;
    return { pass: !!ok, detail: d.overall.verdict + " · " + d.overall.block_reason + " · " + d.events.length + " event(s)" };
  });

  function run() {
    return cases.map(function (c, i) {
      var r;
      try { r = c.fn(); } catch (x) { r = { pass: false, detail: "exception: " + x.message }; }
      return { n: i + 1, name: c.name, result: r.pass ? "PASS" : "FAIL", detail: r.detail };
    });
  }
  return { run: run };
})();

if (typeof document !== "undefined" && document.getElementById("rows")) {
  document.getElementById("sim-banner").textContent = window.APP_DATA.fixed_texts.banner;
  var results = window.IGBT.selfcheck.run();
  var rows = document.getElementById("rows");
  results.forEach(function (r) {
    var tr = document.createElement("tr");
    [String(r.n), r.name, r.result, r.detail].forEach(function (t, i) {
      var td = document.createElement("td");
      td.textContent = t;
      if (i === 2) td.className = r.result;
      if (i === 3) td.style.fontSize = "12px";
      tr.appendChild(td);
    });
    rows.appendChild(tr);
  });
  var passed = results.filter(function (r) { return r.result === "PASS"; }).length;
  document.getElementById("total").textContent = "Total: " + passed + " / " + results.length + " PASS";
  document.getElementById("total").className = passed === results.length ? "PASS" : "FAIL";
}
</script>
</body>
</html>
